hostname: &hostname mcp-google-server-staging.nonprod.vibe.justworks.com

mcp-google-server-env: &env
  env:
    - name: NODE_ENV
      value: production
    - name: TRANSPORT
      value: http
    - name: PORT
      value: "3000"
    - name: GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: mcp-google-server-staging
          key: GOOGLE_CLIENT_ID
    - name: GOOGLE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: mcp-google-server-staging
          key: GOOGLE_CLIENT_SECRET
    - name: GOOGLE_REDIRECT_URI
      value: https://mcp-google-server-staging.nonprod.vibe.justworks.com/callback

# Service
mcp-google-server-service:
  nameOverride: mcp-google-server-service-staging
  fullnameOverride: mcp-google-server-service-staging

  <<: *env

  serviceAccount:
    name: mcp-google-server-staging-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::974932714082:role/app/mcp-google-server-staging

  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:974932714082:certificate/b140e71a-626c-47d8-a33f-cc65e902856a
      external-dns.alpha.kubernetes.io/hostname: *hostname

    customPaths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: ssl-redirect
            port:
              name: use-annotation
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: mcp-google-server-service-staging
            port:
              number: 3000
    hosts:
      - *hostname
    tls:
      - hosts:
          - *hostname

  autoscaling:
    enabled: true

  datadog:
    env: vibe-staging

secret-storage:
  nameOverride: mcp-google-server-secrets-staging
  fullnameOverride: mcp-google-server-secrets-staging
  serviceAccount:
    name: mcp-google-server-staging-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::974932714082:role/app/mcp-google-server-staging
  secretStore:
    name: mcp-google-server-staging
    secrets:
      - secretKey: GOOGLE_CLIENT_ID
        remoteRef:
          key: mcp-google-server-staging/app
          property: GOOGLE_CLIENT_ID
      - secretKey: GOOGLE_CLIENT_SECRET
        remoteRef:
          key: mcp-google-server-staging/app
          property: GOOGLE_CLIENT_SECRET
